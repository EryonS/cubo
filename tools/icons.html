<!doctype html>
<!-- Draws the app icons in the Jouet style. Regenerate with: python3 tools/make_icons.py (dev only). -->
<meta charset="utf-8">
<body style="margin:0">
<script>
  // size: output px. safe: fraction of the canvas the artwork may use (maskable icons need ~0.72).
  function drawIcon(size, safe) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const g = cv.getContext('2d');
    const u = size / 100;
    // Background: toy pink with polka dots, full bleed (the OS applies its own mask).
    g.fillStyle = '#ffe3ee'; g.fillRect(0, 0, size, size);
    g.fillStyle = '#ffc9dc';
    for (let y = 0, row = 0; y < 104; y += 9, row++) {
      for (let x = row % 2 ? 4.5 : 0; x < 104; x += 9) { g.beginPath(); g.arc(x * u, y * u, 1.3 * u, 0, Math.PI * 2); g.fill(); }
    }
    // Board: soft white tile with a pink drop shadow, 3x3 cells.
    const s = safe * 100;
    const o = (100 - s) / 2;
    const bx = (o + s * 0.08) * u, by = (o + s * 0.08) * u, bw = s * 0.84 * u;
    g.save();
    g.shadowColor = 'rgba(200,110,160,0.45)'; g.shadowBlur = 6 * u * safe; g.shadowOffsetY = 3 * u * safe;
    g.fillStyle = '#ffffff';
    g.beginPath(); g.roundRect(bx, by, bw, bw, bw * 0.2); g.fill();
    g.restore();
    const pad = bw * 0.09, gap = bw * 0.045;
    const cell = (bw - pad * 2 - gap * 2) / 3;
    // An L of violet, a mint pair and a yellow block: one empty cell left to fill.
    const layout = [
      ['#8b7cf6', '#8b7cf6', '#ffcf4d'],
      ['#8b7cf6', null, '#6fd6a0'],
      ['#ff7a8a', '#ff7a8a', '#6fd6a0'],
    ];
    layout.forEach((row, r) => row.forEach((color, c) => {
      const x = bx + pad + c * (cell + gap), y = by + pad + r * (cell + gap), rr = cell * 0.26;
      if (!color) {
        g.fillStyle = '#f6e9f2';
        g.beginPath(); g.roundRect(x, y, cell, cell, rr); g.fill();
        return;
      }
      g.fillStyle = color;
      g.beginPath(); g.roundRect(x, y, cell, cell, rr); g.fill();
      g.fillStyle = 'rgba(0,0,0,0.16)';
      g.beginPath(); g.roundRect(x, y + cell * 0.74, cell, cell * 0.26, [0, 0, rr, rr]); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.4)';
      g.beginPath(); g.roundRect(x + cell * 0.14, y + cell * 0.1, cell * 0.72, cell * 0.2, cell * 0.1); g.fill();
    }));
    return cv.toDataURL('image/png');
  }
  window.icons = {
    'icon-512.png': drawIcon(512, 0.92),
    'icon-192.png': drawIcon(192, 0.92),
    'apple-touch-icon.png': drawIcon(180, 0.92),
    'icon-maskable-512.png': drawIcon(512, 0.72),
  };
</script>
